services:
  - type: web
    name: campus-passes
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: ORG_NAME
        value: SRM
      - key: TICKET_SIGNING_SECRET
        generateValue: true
      - key: ORGANIZER_PASSCODE
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
